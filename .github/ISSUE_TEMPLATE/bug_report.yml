name: Bug report
description: Report a reproducible problem in Rae's Big Ride.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please report only reproducible product behavior. Do not include child names, photos, voice recordings, transcripts, contact details, or other personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed child data, voice recordings, transcripts, screenshots with personal data, and other sensitive information.
          required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and operating system
      description: For example, Chrome 132 on Android 15. Do not include identifying information.
      placeholder: Chrome version, device class, operating system
    validations:
      required: true
  - type: dropdown
    id: input-path
    attributes:
      label: Affected interaction
      options:
        - Voice recognition or microphone permission
        - Voice-unavailable fallback
        - Touch input
        - Keyboard input
        - Rendering or performance
        - Gameplay or UI
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal sequence that another person can repeat without sensitive data.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact, if any
      description: Describe blocked keyboard, touch, readability, status-message, or fallback behavior. Do not add sensitive media.
